
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飲料訂購系統 - 50%找奶茶系列</title>

    <style>
        /* ===== 全體背景 ===== */
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #17191f;
            background-image: linear-gradient(135deg, #17191f, #252936);
            padding: 30px 20px;
            margin: 0;
            min-height: 100vh;
            color: #e8e4dc;
        }

        /* ===== 訂購卡片 ===== */
        .order-card {
            max-width: 500px;
            margin: 30px auto;
            background: #252a35;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #444957;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        /* ===== 標題 ===== */
        h2 {
            text-align: center;
            color: #e8c98b;
            font-size: 25px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* ===== 提示框 ===== */
        .notice {
            background-color: #393329;
            color: #e8c98b;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
            border-left: 4px solid #c5a66b;
            line-height: 1.6;
        }

        /* ===== 表單間距 ===== */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #d9c9a5;
            font-size: 15px;
        }

        /* ===== 輸入框與選單 ===== */
        input[type="text"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            background-color: #191d26;
            color: #eee9df;
            border: 1px solid #505665;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #c5a66b;
            box-shadow: 0 0 6px rgba(197,166,107,0.3);
        }

        input::placeholder {
            color: #858b98;
        }

        select option {
            background-color: #252a35;
            color: #eee9df;
        }

        /* ===== 計算按鈕 ===== */
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c5a66b, #a98750);
            color: #1d2028;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #e2c58e, #c5a66b);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197,166,107,0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* ===== 訂單結果 ===== */
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #191d26;
            border: 1px solid #505665;
            border-radius: 10px;
            color: #e8e4dc;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .result-box h3 {
            color: #e8c98b;
            text-align: center;
            border-bottom: 1px solid #505665;
            padding-bottom: 12px;
        }

        .result-box strong {
            color: #d9c9a5;
        }

        .result-box hr {
            border: none;
            border-top: 1px solid #505665;
            margin: 15px 0;
        }

        /* ===== 手機版調整 ===== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .order-card {
                margin: 15px auto;
                padding: 22px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="order-card">

    <h2>🥤 資訊三甲黃淽渝<br>50%找奶茶系列訂購單</h2>

    <div class="notice">
        📢 提示：訂購金額滿 250 元以上即可外送！
        請務必留下聯絡方式。
    </div>

    <form id="drinkForm">

        <!-- 顧客資訊 -->
        <div class="form-group">
            <label for="userName">訂購人姓名：</label>
            <input type="text" id="userName"
                   required placeholder="請輸入姓名">
        </div>

        <div class="form-group">
            <label for="userPhone">聯絡電話：</label>
            <input type="tel" id="userPhone"
                   required placeholder="請輸入電話">
        </div>

        <!-- 品項選擇 -->
        <div class="form-group">
            <label for="drinkSelect">品項：</label>
            <select id="drinkSelect">
                <option value="奶茶">1. 奶茶 (M:50/L:60)</option>
                <option value="奶綠">2. 奶綠 (M:50/L:60)</option>
                <option value="紅茶瑪奇朵">3. 紅茶瑪奇朵 (M:50/L:60)</option>
                <option value="烏龍瑪奇朵">4. 烏龍瑪奇朵 (M:50/L:60)</option>
                <option value="四季奶青">5. 四季奶青 (M:50/L:60)</option>
                <option value="黃金烏龍奶茶">6. 黃金烏龍奶茶 (M:50/L:60)</option>
                <option value="阿華田">7. 阿華田 (M:55/L:65)</option>
                <option value="蘋果茉莉綠茶">8. 蘋果茉莉綠茶 (M:55/L:65)</option>
            </select>
        </div>

        <!-- 容量選擇 -->
        <div class="form-group">
            <label for="sizeSelect">容量：</label>
            <select id="sizeSelect">
                <option value="M">中杯 (M)</option>
                <option value="L">大杯 (L)</option>
            </select>
        </div>

        <!-- 甜度選擇 -->
        <div class="form-group">
            <label for="sugarSelect">甜度：</label>
            <select id="sugarSelect">
                <option value="正常">正常</option>
                <option value="9分">9分</option>
                <option value="少糖">少糖</option>
                <option value="半糖">半糖</option>
                <option value="微糖">微糖</option>
                <option value="無糖">無糖</option>
            </select>
        </div>

        <!-- 冰塊選擇 -->
        <div class="form-group">
            <label for="iceSelect">冰塊：</label>
            <select id="iceSelect">
                <option value="正常冰">正常冰</option>
                <option value="少冰">少冰</option>
                <option value="去冰">去冰</option>
                <option value="熱飲">熱飲</option>
            </select>
        </div>

        <!-- 數量 -->
        <div class="form-group">
            <label for="quantity">數量：</label>
            <input type="number" id="quantity"
                   value="1" min="1" step="1" required>
        </div>

        <button type="button" onclick="calculateTotal()">
            計算總金額並結帳
        </button>

    </form>

    <!-- 訂單結果 -->
    <div class="result-box" id="result" style="display:none;"></div>

</div>

<script>

    // 價格表：根據「找奶茶」菜單設定價目
    const menuPrices = {
        "奶茶": { M: 50, L: 60 },
        "奶綠": { M: 50, L: 60 },
        "紅茶瑪奇朵": { M: 50, L: 60 },
        "烏龍瑪奇朵": { M: 50, L: 60 },
        "四季奶青": { M: 50, L: 60 },
        "黃金烏龍奶茶": { M: 50, L: 60 },
        "阿華田": { M: 55, L: 65 },
        "蘋果茉莉綠茶": { M: 55, L: 65 }
    };

    function calculateTotal() {

        const name = document.getElementById("userName").value.trim();
        const phone = document.getElementById("userPhone").value.trim();

        // 檢查顧客資料
        if (!name || !phone) {
            alert("請先填寫訂購人姓名與聯絡電話！");
            return;
        }

        const drink = document.getElementById("drinkSelect").value;
        const size = document.getElementById("sizeSelect").value;
        const sugar = document.getElementById("sugarSelect").value;
        const ice = document.getElementById("iceSelect").value;
        const qty = parseInt(document.getElementById("quantity").value);

        // 檢查數量
        if (!Number.isInteger(qty) || qty < 1) {
            alert("請輸入正確的訂購數量！");
            return;
        }

        // 取得單價並計算總額
        const unitPrice = menuPrices[drink][size];
        const totalPrice = unitPrice * qty;

        // 判斷是否滿足 250 元外送條件
        const canDeliver = totalPrice >= 250
            ? "✅ 已達 250 元外送門檻"
            : "❌ 未達 250 元外送門檻（限自取）";

        // 顯示結果
        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";

        resultDiv.innerHTML = `
            <h3>訂單明細確認</h3>
            <p><strong>訂購人：</strong> ${name}（${phone}）</p>
            <p><strong>品項：</strong> ${drink} (${size})</p>
            <p><strong>客製化：</strong> ${sugar} / ${ice}</p>
            <p><strong>數量：</strong> ${qty} 杯</p>
            <p><strong>總金額：</strong> $${totalPrice} 元</p>
            <hr>
            <p><strong>外送狀態：</strong> ${canDeliver}</p>
        `;
    }

</script>

</body>
</html>
