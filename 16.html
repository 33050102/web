<!DOCTYPE html>
<html>
  <head>
    <title>九九乘法表</title>
    <h2>資三甲黃淽渝</h2>
    <style>
        table, th, td {
                        border: 1px solid rgb(40, 37, 56);
                        border-radius: 10px;
                      }
        th, td {
                    background-color: #c7fcfc;
                }
    </style>
     <script>
        document.write("<table align='center'>");
    for (let i = 0; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 0; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
      document.write("<table align='center'>");
    </script>

  </head>

<body>

</body>
</html>
