
<!DOCTYPE html>
<html>
<body>

<h1>資訊三甲 黃淽渝 猜燈泡遊戲</h1>

<p>猜猜系統想要開燈還是關燈？</p>

<img id="myImage" src="pic_bulboff.gif"
width="100" height="180">

<p id="result">請選擇開燈或關燈！</p>

<button onclick="light(1)">開燈</button>
<button onclick="light(0)">關燈</button>

<script>

function light(sw) {

  var answer = Math.floor(Math.random() * 2);
  var pic;

  if (sw == answer) {

    document.getElementById("result").innerHTML =
    "答對了！";

  } else {

    document.getElementById("result").innerHTML =
    "答錯了！";
  }

  if (sw == 0) {
    pic = "pic_bulboff.gif";
  } else {
    pic = "pic_bulbon.gif";
  }

  document.getElementById("myImage").src = pic;

}

</script>

</body>
</html>
